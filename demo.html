<script>(function(root){
  'use strict';
  const RESERVED=['Pendiente','En preparación','Listo para repartir'];
  const TRANSIT=['En reparto','No entregado'];
  const FLOW={'Pendiente':['En preparación','Cancelado'],'En preparación':['Listo para repartir','Cancelado'],'Listo para repartir':['En reparto','Cancelado'],'En reparto':['Entregado','No entregado','Devuelto'],'No entregado':['En reparto','Devuelto'],'Entregado':[],'Cancelado':[],'Devuelto':[]};
  const clone=x=>JSON.parse(JSON.stringify(x));
  const money=x=>Math.round((Number(x)+Number.EPSILON)*100)/100;
  const need=(v,msg)=>{if(!v)throw new Error(msg);};
  const txt=(v,max=200)=>String(v==null?'':v).trim().slice(0,max);
  const number=(v,label,min=0,integer=false)=>{const n=Number(v);need(v!==''&&v!==null&&v!==undefined&&Number.isFinite(n)&&n>=min&&(!integer||Number.isInteger(n)),label+' no válido.');return n;};
  function date(v){need(/^\d{4}-\d{2}-\d{2}$/.test(v),'Fecha no válida.');const d=new Date(v+'T12:00:00Z');need(!isNaN(d)&&d.toISOString().slice(0,10)===v,'Fecha no válida.');return v;}
  function reserved(s,id){return s.orders.filter(o=>RESERVED.includes(o.status)).reduce((n,o)=>n+o.items.filter(i=>i.productId===id).reduce((q,i)=>q+i.qty,0),0);}
  function transit(s,id){return s.orders.filter(o=>TRANSIT.includes(o.status)).reduce((n,o)=>n+o.items.filter(i=>i.productId===id).reduce((q,i)=>q+i.qty,0),0);}
  function available(s,id){const p=s.products.find(p=>p.id===id);return p?p.stock-reserved(s,id):0;}
  function total(o){return money(o.items.reduce((sum,i)=>sum+i.qty*i.price,0));}
  function due(o){return ['Cancelado','Devuelto'].includes(o.status)?0:money(Math.max(0,total(o)-o.paid));}
  function audit(s,when,title,detail){s.history.unshift({id:'h'+s.nextId++,when,title:txt(title),detail:txt(detail,1000)});}
  function stockMove(s,p,qty,kind,ref,when,note){p.stock+=qty;s.movements.unshift({id:'m'+s.nextId++,when,productId:p.id,qty,kind,ref:txt(ref),note:txt(note,500)});}
  function transportFor(o){
    const t=o.transport||{};
    return {company:txt(t.company,120),vehiclePlate:txt(t.vehiclePlate,24).toUpperCase(),driverName:txt(t.driverName==null?o.driver:t.driverName,120),documentType:txt(t.documentType,20)||'CI',documentNumber:txt(t.documentNumber,40)};
  }
  function transportFrom(o,input,driver){
    const t=Object.assign(transportFor(o),input||{});
    if(driver!==undefined&&!(input&&Object.prototype.hasOwnProperty.call(input,'driverName')))t.driverName=driver;
    const clean=transportFor({transport:t});need(['CI','Pasaporte','Otro'].includes(clean.documentType),'Tipo de documento del conductor no válido.');return clean;
  }
  function recordTransport(o,t,when,reason){
    o.transport=clone(t);o.driver=t.driverName;
    o.transportHistory=o.transportHistory||[];o.transportHistory.push({when,reason,transport:clone(t)});
  }
  function addCustomer(s,a,when){
    const name=txt(a.name,100),phone=txt(a.phone,40),address=txt(a.address,200);need(name&&phone&&address,'Completá nombre, teléfono y dirección.');
    const digits=phone.replace(/\D/g,'');need(digits.length>=7,'Revisá el teléfono del cliente.');need(!s.customers.some(x=>x.phone.replace(/\D/g,'')===digits),'Ya existe un cliente con ese teléfono. Elegilo de la lista de clientes registrados.');
    const c={id:'c'+s.nextId++,name,phone,address,area:txt(a.area,80)||'Sin zona',note:txt(a.note,500)};s.customers.push(c);audit(s,when,'Cliente registrado',c.name);return c;
  }
  function validate(s){
    need(s&&s.schema===1&&Array.isArray(s.products)&&Array.isArray(s.orders),'Datos incompatibles.');
    need(new Set(s.products.map(p=>p.id)).size===s.products.length,'Productos duplicados.');
    need(new Set(s.products.map(p=>p.sku)).size===s.products.length,'Códigos duplicados.');
    need(new Set(s.customers.map(c=>c.id)).size===s.customers.length,'Clientes duplicados.');
    need(new Set(s.orders.map(o=>o.id)).size===s.orders.length,'Pedidos duplicados.');
    s.products.forEach(p=>{number(p.stock,'Stock',0,true);number(p.price,'Precio');need(available(s,p.id)>=0,'Stock insuficiente para las reservas de '+p.name+'.');});
    s.orders.forEach(o=>{need(FLOW[o.status]&&s.customers.some(c=>c.id===o.customerId),'Pedido inconsistente.');need(o.items.length>0,'Pedido vacío.');o.items.forEach(i=>{need(s.products.some(p=>p.id===i.productId),'Producto inexistente.');number(i.qty,'Cantidad',1,true);number(i.price,'Precio');});number(o.paid,'Cobro');need(o.paid<=total(o),'El cobro supera el importe del pedido.');if(o.transport){need(['CI','Pasaporte','Otro'].includes(o.transport.documentType),'Tipo de documento no válido.');need(typeof o.transport.documentNumber==='string','El número de documento debe conservarse como texto.');}});
    return true;
  }
  function apply(input,action){
    need(action&&typeof action==='object','Operación no válida.');
    need(/^[a-zA-Z0-9_-]{6,100}$/.test(action.requestId||''),'Falta identificador de operación.');
    if((input.requests||[]).includes(action.requestId))return clone(input);
    const s=clone(input),a=action.data||{},when=action.when||new Date().toISOString();
    need(!isNaN(Date.parse(when)),'Fecha de operación no válida.');
    let p,o,c;
    switch(action.type){
      case 'addProduct':{
        const sku=txt(a.sku,40).toUpperCase(),name=txt(a.name,100);
        need(sku&&name,'Completá código y nombre del producto.');need(!s.products.some(x=>x.sku===sku),'Ya existe un producto con ese código.');
        p={id:'p'+s.nextId++,sku,name,category:txt(a.category,60)||'General',price:money(number(a.price,'Precio')),stock:0,min:number(a.min,'Stock mínimo',0,true)};
        s.products.push(p);const opening=number(a.stock,'Stock inicial',0,true);if(opening)stockMove(s,p,opening,'Ingreso inicial','Alta',when,'Stock al crear el producto');
        audit(s,when,'Producto creado',p.name+' · '+p.sku);break;
      }
      case 'movement':{
        p=s.products.find(x=>x.id===a.productId);need(p,'Producto inexistente.');const qty=number(a.qty,'Cantidad',1,true);need(['Ingreso','Ajuste positivo','Ajuste negativo'].includes(a.kind),'Tipo de movimiento no válido.');
        const note=txt(a.note,500);need(note,'Indicá el motivo del movimiento.');const signed=a.kind==='Ajuste negativo'?-qty:qty;need(p.stock+signed>=reserved(s,p.id),'El ajuste afectaría unidades reservadas.');
        stockMove(s,p,signed,a.kind,'Manual',when,note);audit(s,when,'Movimiento de stock',p.name+' · '+(signed>0?'+':'')+signed+' unidades');break;
      }
      case 'addCustomer':{
        addCustomer(s,a,when);break;
      }
      case 'createOrder':{
        if(a.newCustomer){need(!a.customerId,'Elegí un cliente registrado o ingresá uno nuevo.');c=addCustomer(s,a.newCustomer,when);}
        else c=s.customers.find(x=>x.id===a.customerId);
        need(c,'Elegí un cliente o registrá uno nuevo.');need(Array.isArray(a.items)&&a.items.length>0&&a.items.length<=50,'Agregá al menos un producto.');
        const merged={};a.items.forEach(i=>{p=s.products.find(x=>x.id===i.productId);need(p,'Producto inexistente.');const qty=number(i.qty,'Cantidad',1,true);merged[p.id]=(merged[p.id]||0)+qty;});
        const items=Object.keys(merged).map(id=>{p=s.products.find(x=>x.id===id);need(merged[id]<=available(s,id),'Stock disponible insuficiente de '+p.name+'.');return {productId:id,qty:merged[id],price:p.price};});
        o={id:'PED-'+String(s.nextOrder++).padStart(4,'0'),customerId:c.id,items,status:'Pendiente',paid:money(number(a.paid==null?0:a.paid,'Cobro')),createdAt:when,deliveryDate:date(a.deliveryDate),driver:txt(a.driver,80),note:txt(a.note,500),events:[{when,status:'Pendiente',note:'Pedido registrado; stock reservado.'}]};
        const transport=transportFrom(o,a.transport,a.driver);o.transport=transport;o.driver=transport.driverName;
        if(transport.company||transport.vehiclePlate||transport.driverName||transport.documentNumber)recordTransport(o,transport,when,'Al registrar el pedido');
        need(o.paid<=total(o),'El cobro supera el importe del pedido.');s.orders.unshift(o);audit(s,when,'Pedido registrado',o.id+' · '+c.name);break;
      }
      case 'status':{
        o=s.orders.find(x=>x.id===a.orderId);need(o,'Pedido inexistente.');need(FLOW[o.status].includes(a.status),'Ese cambio de estado no está permitido.');
        const note=txt(a.note,500),old=o.status;need(!['No entregado','Devuelto'].includes(a.status)||note,'Registrá el motivo de la incidencia o devolución.');
        need(a.status!=='Cancelado'||o.paid===0,'El pedido tiene cobros; requiere revisión antes de cancelar.');
        if(a.status==='En reparto'){

 function reports(){
  const delivered=state.orders.filter(o=>o.status==='Entregado'),sales=delivered.reduce((n,o)=>n+M.total(o),0),collected=state.orders.reduce((n,o)=>n+o.paid,0),due=state.orders.reduce((n,o)=>n+M.due(o),0),intransit=state.orders.filter(o=>M.TRANSIT.includes(o.status));
  const dates=Array.from({length:7},(_,i)=>{const d=new Date(state.referenceDate+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-6+i);return d.toISOString().slice(0,10);});
  const amounts=dates.map(d=>delivered.filter(o=>(o.deliveredAt||'').slice(0,10)===d).reduce((n,o)=>n+M.total(o),0)),max=Math.max(...amounts,1);
  const ranked=state.products.map(p=>({p,n:delivered.reduce((n,o)=>n+o.items.filter(i=>i.productId===p.id).reduce((q,i)=>q+i.qty,0),0)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,5);
  return pagehead('Reportes','Información para decidir, con la misma base de pedidos y movimientos.','<div class="flex wrap"><button class="btn light" data-action="export-csv">'+icon('download')+'Descargar pedidos</button><button class="btn" data-action="export-json">'+icon('download')+'Exportar datos</button></div>')+
  '<section class="metrics">'+metric('Pedidos entregados',delivered.length,'Historial completo de la demostración','check')+metric('Importe entregado',fmt(sales),'Valor de pedidos con entrega confirmada','chart','blue')+metric('Cobros registrados',fmt(collected),'Incluye anticipos de pedidos activos','money','purple')+metric('Saldo por cobrar',fmt(due),'Sin pedidos cancelados o devueltos','clock','orange')+'</section>'+
  '<div class="report-grid"><section class="panel"><div class="panel-head"><div><h2>Entregas de la semana de ejemplo</h2><p>Importe por fecha de entrega confirmada</p></div><span class="tag">UYU</span></div><div class="panel-body"><div class="bars">'+dates.map((d,i)=>'<div class="bar-col"><span class="bar-val">'+fmt(amounts[i])+'</span><div class="bar-shell"><div class="bar '+(i===6?'current':'')+'" style="height:'+Math.max(2,amounts[i]/max*100)+'%" aria-label="'+dateFmt(d)+': '+fmt(amounts[i])+'"></div></div><span class="bar-label">'+dateFmt(d)+'</span></div>').join('')+'</div><p class="report-note">Ventas entregadas y cobros se muestran por separado: un anticipo puede cobrarse antes de la entrega.</p></div></section>'+
  '<section class="panel"><div class="panel-head"><div><h2>Productos más entregados</h2><p>Unidades de pedidos entregados</p></div>'+icon('box')+'</div><div class="panel-body">'+ranked.map(r=>'<div class="rank"><div class="rank-top"><span>'+esc(r.p.name)+'</span><strong>'+r.n+' u.</strong></div><div class="progress"><i style="width:'+(r.n/Math.max(1,...ranked.map(x=>x.n))*100)+'%"></i></div></div>').join('')+'</div></section></div>'+
  '<div class="lower-grid"><section class="panel"><div class="panel-head"><h2>Situación del inventario</h2>'+icon('box')+'</div><div class="panel-body breakdown"><div><span>Unidades físicas en depósito</span><strong>'+num(state.products.reduce((n,p)=>n+p.stock,0))+'</strong></div><div><span>Reservadas para pedidos</span><strong>'+num(state.products.reduce((n,p)=>n+M.reserved(state,p.id),0))+'</strong></div><div><span>Disponibles para vender</span><strong>'+num(state.products.reduce((n,p)=>n+M.available(state,p.id),0))+'</strong></div><div><span>Unidades con repartidores</span><strong>'+num(state.products.reduce((n,p)=>n+M.transit(state,p.id),0))+'</strong></div><p class="report-note">El disponible ya forma parte del stock físico; las reservas no se suman como mercadería adicional.</p></div></section>'+
  '<section class="panel"><div class="panel-head"><h2>Seguimiento de entregas</h2>'+icon('truck')+'</div><div class="panel-body breakdown"><div><span>Listos para despachar</span><strong>'+state.orders.filter(o=>o.status==='Listo para repartir').length+'</strong></div><div><span>Pedidos en reparto</span><strong>'+intransit.length+'</strong></div><div><span>Entregas con incidencia</span><strong>'+state.orders.filter(o=>o.status==='No entregado').length+'</strong></div><div><span>Pedidos retornados al depósito</span><strong>'+state.orders.filter(o=>o.status==='Devuelto').length+'</strong></div><p class="report-note">Reportes operativos en UYU. El importe entregado no representa ganancia ni sustituye la contabilidad.</p></div></section></div>';
 }
 function filter(){
  const q=($('#search')?.value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),status=$('#status-filter')?.value||'all',stock=$('#stock-filter')?.value||'all';let shown=0;
  document.querySelectorAll('[data-record]').forEach(el=>{const value=(el.dataset.search||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const show=value.includes(q)&&(status==='all'||el.dataset.status===status)&&(stock==='all'||el.dataset.low==='true');el.classList.toggle('hidden',!show);if(show)shown++;});
  $('#no-results')?.classList.toggle('hidden',shown>0);
 }
 function openModal(title,subtitle,html,presentation=false){
  const el=$('#modal');$('#modal-title').textContent=title;$('#modal-subtitle').textContent=subtitle;$('#modal-body').innerHTML=html;el.classList.toggle('presentation',presentation);if(!el.open)el.showModal();$('#modal-body').scrollTop=0;
 }

 const field=(label,name,type='text',extra='')=>'<div class="form-row"><label for="f-'+name+'">'+label+'</label><input id="f-'+name+'" name="'+name+'" type="'+type+'" '+extra+' required></div>';

 function packTransport(a){
  if(!Object.prototype.hasOwnProperty.call(a,'transportCompany'))return;
  a.transport={company:a.transportCompany,vehiclePlate:a.vehiclePlate,driverName:a.driver,documentType:a.documentType,documentNumber:a.documentNumber};
  ['transportCompany','vehiclePlate','driver','documentType','documentNumber'].forEach(k=>delete a[k]);
 }

 function orderCustomerMode(useNew){
  const select=$('#f-customerId'),panel=$('#order-new-customer'),toggle=$('[data-action="order-customer-mode"]');if(!select||!panel)return;
  if(useNew&&select.value!=='__new__')select.dataset.previous=select.value;
  select.classList.toggle('hidden',useNew);select.disabled=useNew;panel.disabled=!useNew;panel.classList.toggle('hidden',!useNew);
  toggle.setAttribute('aria-expanded',String(useNew));toggle.innerHTML=useNew?'Elegir cliente registrado':icon('plus')+'Nuevo cliente';
  $('[data-form="order"] button[type="submit"]').textContent=useNew?'Guardar cliente y pedido':'Guardar y reservar';
  $('#form-error')?.classList.add('hidden');
  if(!useNew){select.value=select.dataset.previous||'';select.focus();}else $('#f-newName').focus();
 }

 function customerDetail(id){const c=customer(id),os=state.orders.filter(o=>o.customerId===id);openModal(c.name,c.area+' · '+c.phone,'<p class="small muted" style="line-height:1.6">'+esc(c.address)+(c.note?'<br>'+esc(c.note):'')+'</p><div class="detail-summary"><div><small>Pedidos registrados</small><strong>'+os.length+'</strong></div><div><small>Saldo pendiente</small><strong>'+fmt(os.reduce((n,o)=>n+M.due(o),0))+'</strong></div></div><div class="stack">'+os.map(o=>'<div class="flex between wrap"><div><button class="link-btn" data-action="order-detail" data-id="'+o.id+'">'+o.id+'</button><p class="caption">'+dateFmt(o.deliveryDate)+' · '+fmt(M.total(o))+'</p></div>'+badge(o.status)+'</div>').join('')+'</div><div class="modal-actions"><button class="btn" data-action="new-order" data-customer="'+id+'">'+icon('plus')+'Nuevo pedido</button></div>');}
 function changeStatus(id,status){const o=state.orders.find(x=>x.id===id);const explanations={'En preparación':'Se mantienen reservadas las unidades del pedido.','Listo para repartir':'El pedido queda disponible para despachar.','En reparto':o.status==='No entregado'?'Se reintenta la entrega con la misma mercadería; no se descuenta stock otra vez.':'Las unidades salen del depósito y pasan a estar con el repartidor.','Entregado':'Se registra la entrega completa. El cobro se controla por separado.','No entregado':'La mercadería continúa con el repartidor hasta confirmar su retorno físico.','Devuelto':'Confirmá que recibiste físicamente todas las unidades del pedido en el depósito.','Cancelado':'Se libera la reserva de stock del pedido.'};
  openModal(status,id+' · '+customer(o.customerId).name,'<form data-form="status"><input type="hidden" name="orderId" value="'+id+'"><input type="hidden" name="status" value="'+esc(status)+'"><div class="note-strip">'+explanations[status]+'</div>'+(status==='En reparto'?transportFields(o,true):'')+'<div class="form-grid" style="margin-top:18px"><div class="form-row full"><label for="f-note">'+(['No entregado','Devuelto'].includes(status)?'Motivo (obligatorio)':'Observación (opcional)')+'</label><textarea id="f-note" name="note" maxlength="500" '+(['No entregado','Devuelto'].includes(status)?'required':'')+'></textarea></div></div>'+formEnd('Confirmar '+(status==='Entregado'?'entrega':status==='Devuelto'?'retorno':'cambio')));
 }
 function collect(id){const o=state.orders.find(x=>x.id===id);openModal('Registrar cobro',id+' · Saldo pendiente '+fmt(M.due(o)),'<form data-form="collect"><input name="orderId" type="hidden" value="'+id+'"><div class="form-grid">'+field('Importe recibido · UYU','amount','number','min="0.01" max="'+M.due(o)+'" step="0.01" value="'+M.due(o)+'"')+'</div><p class="report-note">Registro manual de un cobro recibido. No realiza un pago bancario.</p>'+formEnd('Registrar cobro'));}
 function assign(id){const o=state.orders.find(x=>x.id===id);openModal('Asignar transporte',id+' · Empresa, vehículo e identificación del conductor','<form data-form="assign"><input name="orderId" type="hidden" value="'+id+'">'+transportFields(o,true)+'<p class="form-help" style="margin-top:16px">La asignación queda guardada en este pedido. Los cambios posteriores conservan la referencia anterior en el historial.</p>'+formEnd('Guardar transporte'));}
 const slides=[
  {label:'La propuesta',title:'Un negocio pequeño.<br>Una gestión completa.',text:'Una herramienta para emprendimientos que venden productos y necesitan controlar sus pedidos, sus clientes y las entregas desde un mismo lugar.',points:[['box','Inventario claro','Saber qué hay y qué está reservado.'],['order','Pedidos en orden','Seguir cada etapa sin perder el historial.'],['truck','Entregas visibles','Conocer qué salió y qué falta entregar.']]},
  {label:'El problema cotidiano',title:'Vender es una parte.<br>Hacer seguimiento es otra.',text:'La propuesta apunta a un dueño que hoy reparte la información entre mensajes, anotaciones y planillas. El primer piloto debe comprobar si esta herramienta le ahorra trabajo y evita errores.',points:[['people','Clientes','Contacto, dirección e historial juntos.'],['clock','Pendientes','Pedidos por preparar, entregar o cobrar.'],['chart','Decisiones','Reportes basados en los movimientos.']]},
  {label:'Una operación conectada',title:'Cada pedido actualiza<br>el resto del negocio.',text:'Se elige un cliente y se registran productos. El pedido reserva stock, avanza a preparación, sale a reparto y se cierra con su entrega. El cobro se registra por separado.',points:[['box','Al reservar','Disminuye el stock disponible.'],['truck','Al despachar','Se registra la salida del depósito.'],['check','Al entregar','Queda la constancia en el historial.']],view:'orders'},
  {label:'Las excepciones también cuentan',title:'Una entrega fallida<br>no borra la mercadería.',text:'Si el cliente no recibe el pedido, las unidades siguen con el repartidor. Recién al confirmar el retorno físico vuelven al depósito. La demo permite probar este caso completo.',points:[['alert','Incidencia','Se registra un motivo.'],['truck','Reintento','No descuenta stock dos veces.'],['box','Retorno','Recupera las unidades al recibirlas.']],view:'deliveries'},
  {label:'La idea técnica',title:'Interfaz web sencilla.<br>Datos en Google Sheets.',text:'La demo funciona sola en el navegador. El paquete incluye una versión para instalar en Google Apps Script y guardar las operaciones en una planilla de Google Sheets dentro de Drive. Esa conexión requiere configuración y prueba en una cuenta Google.',points:[['grid','Interfaz gráfica','Formularios, listados e indicadores.'],['cloud','Apps Script','Valida y guarda las operaciones.'],['order','Google Sheets','Registros en una planilla del negocio.']]},
  {label:'Conversación con Fabián',title:'El próximo paso:<br>probarlo con un negocio real.',text:'Propuesta inicial: elegir un emprendimiento, observar cómo trabaja y probar un circuito completo. Después definir alcance, reparto de tareas, costos de mantenimiento y forma de venta.',points:[['people','Validar','Identificar un primer usuario y su problema.'],['check','Probar','Stock, pedido, reparto y cobro completos.'],['chart','Decidir','Ajustar el producto con evidencia del piloto.']]}
 ];
 function present(n=0){slide=Math.max(0,Math.min(slides.length-1,n));const s=slides[slide];openModal('Propuesta de producto','Martín · Conversación con Fabián',
  '<section class="slide"><div class="slide-label">'+s.label+'</div><h2>'+s.title+'</h2><p>'+s.text+'</p><div class="slide-points">'+s.points.map(p=>'<div class="slide-point">'+icon(p[0])+'<div><strong>'+p[1]+'</strong><span>'+p[2]+'</span></div></div>').join('')+'</div><div class="slide-nav"><div class="dots" aria-label="Pantalla '+(slide+1)+' de '+slides.length+'">'+slides.map((_,i)=>'<span class="'+(i===slide?'active':'')+'"></span>').join('')+'</div><div class="flex wrap">'+(slide>0?'<button class="btn light compact" data-action="slide-prev">Anterior</button>':'')+(s.view?'<button class="btn light compact" data-action="explore" data-view="'+s.view+'">Ver en la demo</button>':'')+(slide<slides.length-1?'<button class="btn compact" data-action="slide-next">Siguiente</button>':'<button class="btn compact" data-action="explore" data-view="dashboard">Explorar la demo</button>')+'</div></div></section>',true);
 }
 function download(filename,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function exportCsv(){const safe=v=>{let t=String(v==null?'':v);if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};const rows=[['Pedido','Cliente','Entrega prevista','Estado','Total UYU','Cobrado UYU','Saldo UYU','Empresa transportista','Matrícula','Conductor','Tipo de documento','Número de documento'],...state.orders.map(o=>{const t=M.transportFor(o);return [o.id,customer(o.customerId).name,o.deliveryDate,o.status,M.total(o),o.paid,M.due(o),t.company,t.vehiclePlate,t.driverName,t.documentType,t.documentNumber];})];download('Pedidos_demo.csv','\ufeff'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Reporte de pedidos descargado.');}
 async function refresh(){try{if(cloud){const r=await gas('getAppState');state=r.state;connectionInfo=r.connection||connectionInfo;connectionError='';}render();toast(cloud?'Datos leídos desde Google Sheets.':'Datos actualizados.');return true;}catch(e){connectionError=e.message;render();toast(e.message,true);return false;}}
 function connectionPanel(){
  menu(false);
  if(cloud){
   const c=connectionInfo;
   if(!c){openModal('Conexión con Google Sheets','No se pudo identificar la planilla.','<p class="small muted">Actualizá los datos para volver a comprobar la conexión.</p><div class="modal-actions"><button class="btn" data-action="check-connection">Comprobar conexión</button></div>');return;}
   openModal('Conexión con Google Sheets','Los registros se leen y se guardan en esta planilla.',
    '<div class="connection-status"><strong>'+(connectionError?'No se pudo verificar la conexión':'Conectada a Google Sheets')+'</strong><p>'+(connectionError?esc(connectionError):'Los pedidos, clientes, productos y datos de transporte se guardan en la hoja al confirmar cada operación.')+'</p></div><div class="connection-info"><strong>'+esc(c.name)+'</strong><br><a href="'+esc(c.url)+'" target="_blank" rel="noopener">Abrir planilla de datos</a><br>Última lectura: '+esc(new Date(c.checkedAt).toLocaleString('es-UY',{timeZone:'America/Montevideo'}))+'<br>Último guardado: '+(c.lastSavedAt?esc(new Date(c.lastSavedAt).toLocaleString('es-UY',{timeZone:'America/Montevideo'})):'Sin operaciones nuevas en esta instalación')+'</div><div class="modal-actions"><button class="btn light" data-action="check-connection">Volver a leer los datos</button></div>'+
    (c.canConfigure?'<details class="transport-editor"><summary>Vincular otra hoja</summary><form data-form="sheet-connection"><div class="form-row"><label for="f-sheetUrl">Enlace de la hoja de Google Sheets</label><input id="f-sheetUrl" name="sheetUrl" type="url" required placeholder="https://docs.google.com/spreadsheets/d/…"></div><p class="form-help" style="margin-top:13px">Si la hoja está vacía, se copiarán allí los datos actuales. Si ya pertenece a esta app, se cargarán sus registros. La planilla anterior se conserva.</p>'+formEnd('Usar esta hoja')+'</details>':'')
   );
  }else{
   const installedUrl='https://script.google.com/macros/s/AKfycbxKyYEBzUXP0ZP0LmcXpvy4-L9NZ9bu6JJ34ayNBUwniS4uoXP-RVvrM7CD2Cbe78nL9w/exec';
   let url=installedUrl;try{url=localStorage.getItem('gestion-demo-google-app-url')||installedUrl;}catch{}
   openModal('Guardar en Google Sheets','La versión de Google ya está preparada.',
    '<div class="connection-status"><strong>Estás usando la demo de este navegador</strong><p>Para guardar los datos del negocio en Drive, abrí el sistema instalado en Google. Las pruebas de esta demo se conservan en este navegador.</p></div><div class="modal-actions"><a class="btn" href="'+installedUrl+'" target="_blank" rel="noopener">Abrir sistema en Google</a></div><p class="form-help" style="margin:15px 0">Ingresá con la cuenta propietaria de la planilla. Si Google muestra un error cuando hay varias cuentas abiertas, usá una ventana privada.</p><div class="connection-info"><a href="https://docs.google.com/spreadsheets/d/1x_OZbSsAPt7tdH9J5_RJ3nxNwMxAlUlbrLXbR4nxK7M/edit?usp=drivesdk" target="_blank" rel="noopener">Abrir planilla en Drive</a><p>Incluye productos, clientes, pedidos y transporte. Los registros se cargan desde el sistema conectado.</p></div><details class="transport-editor"><summary>Usar otra instalación de Google</summary><form data-form="open-google-app"><div class="form-row"><label for="f-appUrl">Enlace de otra app de Google Apps Script</label><input id="f-appUrl" name="appUrl" type="url" required value="'+esc(url)+'" placeholder="https://script.google.com/macros/s/…/exec"></div><p class="form-help" style="margin-top:13px">Usá el enlace /exec que entrega Google al instalar el conector en otra planilla.</p>'+formEnd('Abrir otra instalación')+'</details>'
   );
  }
 }
 async function connectSheet(a){
  if(!cloud||!connectionInfo?.canConfigure)return;
  busy=true;$('#busy').classList.remove('hidden');
  try{const result=await gas('connectAppSheet',a.sheetUrl,connectionInfo.spreadsheetId);M.validate(result.state);state=result.state;connectionInfo=result.connection;connectionError='';lastAction=null;render();connectionPanel();toast('Planilla vinculada y datos leídos.');}
  catch(e){const error=$('#form-error');if(error){error.textContent=e.message;error.classList.remove('hidden');}else toast(e.message,true);}
  finally{busy=false;$('#busy').classList.add('hidden');}
 }
 function openGoogleApp(a){
  try{const u=new URL(a.appUrl);if(u.origin!=='https://script.google.com'||!/^\/macros\/s\/[A-Za-z0-9_-]+\/exec\/?$/.test(u.pathname)||u.username||u.password||u.search||u.hash)throw new Error('Pegá el enlace /exec de la aplicación web de Google Apps Script.');try{localStorage.setItem('gestion-demo-google-app-url',u.href);}catch{}window.location.assign(u.href);}
  catch(e){const error=$('#form-error');error.textContent=e.message;error.classList.remove('hidden');}
 }
 document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const a=b.dataset.action,id=b.dataset.id;switch(a){
  case 'nav':navigate(b.dataset.view);break;case 'menu':menu(true);break;case 'menu-close':menu(false);break;case 'close':closeModal();break;
  case 'new-product':newProduct();break;case 'new-customer':newCustomer();break;case 'new-order':newOrder(b.dataset.customer);break;case 'movement':movement(id);break;case 'order-detail':orderDetail(id);break;case 'customer-detail':customerDetail(id);break;case 'change-status':changeStatus(id,b.dataset.status);break;case 'collect':collect(id);break;case 'assign':assign(id);break;
  case 'order-customer-mode':orderCustomerMode($('#order-new-customer').disabled);break;
  case 'add-line':if(document.querySelectorAll('.order-line').length>=15){toast('La demo admite hasta 15 líneas por pedido.',true);return;}$('#order-lines').insertAdjacentHTML('beforeend',lineHtml());updateOrderTotal();break;
  case 'remove-line':if(document.querySelectorAll('.order-line').length>1)b.closest('.order-line').remove();updateOrderTotal();break;
  case 'route-filter':routeFilter=b.dataset.value;render();break;case 'present':present();break;case 'slide-next':present(slide+1);break;case 'slide-prev':present(slide-1);break;case 'explore':closeModal();navigate(b.dataset.view);break;
  case 'export-csv':exportCsv();break;case 'export-json':download('Gestion_demo_datos.json',JSON.stringify(state,null,2),'application/json');toast('Copia de datos descargada.');break;
  case 'refresh':refresh();break;
  case 'connection':connectionPanel();break;
  case 'check-connection':await refresh();connectionPanel();break;
  case 'reset':openModal('Restablecer demostración','Solo se reinician los datos de ejemplo de este navegador.','<p class="small muted" style="line-height:1.6">Se quitarán tus pruebas locales y volverán los productos, clientes y pedidos iniciales. Podés exportar los datos desde Reportes antes de continuar.</p><div class="modal-actions"><button class="btn light" data-action="close">Conservar cambios</button><button class="btn danger" data-action="reset-confirm">Restablecer datos ficticios</button></div>');break;
  case 'reset-confirm':if(!cloud){saveLocal(M.seed());lastAction=null;closeModal();render();toast('Demo restablecida.');}break;
 }});
 document.addEventListener('input',e=>{if(e.target.matches('[data-filter]'))filter();if(e.target.closest('#order-lines'))updateOrderTotal();});
 document.addEventListener('change',e=>{if(e.target.matches('[data-filter]'))filter();if(e.target.closest('#order-lines'))updateOrderTotal();if(e.target.id==='f-customerId'){if(e.target.value==='__new__')orderCustomerMode(true);else e.target.dataset.previous=e.target.value;}});
 document.addEventListener('submit',async e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();if(!f.reportValidity())return;const a=Object.fromEntries(new FormData(f));const type=f.dataset.form;packTransport(a);
  if(type==='open-google-app'){openGoogleApp(a);return;}
  if(type==='sheet-connection'){await connectSheet(a);return;}
  if(type==='order'){
   a.items=[...document.querySelectorAll('.order-line')].map(row=>({productId:row.querySelector('.line-product').value,qty:row.querySelector('.line-qty').value}));
   if(!$('#order-new-customer').disabled){a.newCustomer={name:a.newName,phone:a.newPhone,address:a.newAddress,area:a.newArea};delete a.customerId;}
   ['newName','newPhone','newAddress','newArea'].forEach(k=>delete a[k]);await mutate('createOrder',a);
  }
  else await mutate({product:'addProduct',customer:'addCustomer',movement:'movement',status:'status',collect:'collect',assign:'assign'}[type],a);
 });
 $('#modal').addEventListener('cancel',e=>{if(busy)e.preventDefault();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false);if($('#modal').open&&$('#modal').classList.contains('presentation')){if(e.key==='ArrowRight')present(slide+1);if(e.key==='ArrowLeft')present(slide-1);}});
 window.addEventListener('storage',e=>{if(e.key!==KEY||cloud||busy)return;try{const next=JSON.parse(e.newValue);M.validate(next);state=next;closeModal();render();toast('Demo actualizada desde otra pestaña.');}catch{}});
 async function init(){if(cloud){$('#main').innerHTML='<div class="empty">Cargando datos de Google Sheets…</div>';try{const r=await gas('getAppState');state=r.state;connectionInfo=r.connection||null;M.validate(state);render();}catch(e){$('#main').innerHTML='<section class="panel"><div class="empty"><h2>No se pudo abrir la planilla</h2><p style="margin-top:15px">'+esc(e.message)+'</p><button class="btn" style="margin-top:20px" onclick="location.reload()">Reintentar</button></div></section>';}}else{state=M.seed();try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){M.validate(saved);state=saved;}}catch{storageOk=false;}render();}}
 init();
})();
</script>
</body></html>
